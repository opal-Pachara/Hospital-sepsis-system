# ═════════════════════════════════════════════════════════════════════════════
# RTSAS — Real-Time Sepsis Alert System
# ไฟล์ Docker Compose สำหรับรันระบบทั้งระบบแบบ Containerization
#
# คำสั่งพื้นฐานที่ใช้งานบ่อย:
#   - สั่งเริ่มระบบและ Build ใหม่:     docker compose up -d --build
#   - ดูสถานะการทำงาน:               docker compose ps
#   - ดู Log การทำงานแบบ Real-time:  docker compose logs -f
#   - หยุดการทำงานของระบบ:            docker compose down
#
# Services ทั้งหมด:
#   1. auth_db  — MySQL 8 สำหรับเก็บบัญชีผู้ใช้งานระบบ (รันภายใน Docker)
#   2. backend  — FastAPI API Server (เชื่อมต่อ auth_db + ดึงข้อมูล HOSxP ผ่าน LAN)
#   3. frontend — React + Nginx Web Server (เสิร์ฟหน้าเว็บพอร์ต 80)
#
# หมายเหตุเรื่องฐานข้อมูล:
#   - HOSxP MySQL อยู่นอก Docker: เชื่อมต่อผ่าน LAN โดยดึง IP จาก DB_HOST ในไฟล์ .env
# ═════════════════════════════════════════════════════════════════════════════

services:

  # ── 1. Auth Database (ฐานข้อมูลบัญชีผู้ใช้งาน) ──────────────────────────────
  # หน้าที่: เก็บข้อมูลผู้ใช้ (แพทย์, พยาบาล, IT Admin) และสิทธิ์การเข้าใช้งานระบบ
  # สิ่งที่ต้องเตรียม:
  #   - ไม่ต้องติดตั้ง MySQL เพิ่ม ระบบจะสร้าง container ให้เองอัตโนมัติ
  #   - ข้อมูลผู้ใช้จะถูกเก็บถาวรไว้ใน Docker Volume ชื่อ auth_db_data (ไม่หายเมื่อรีสตาร์ต)
  auth_db:
    image: mysql:8.0
    container_name: rtsas_auth_db
    restart: unless-stopped
    environment:
      TZ: Asia/Bangkok
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-rtsas_root}
      MYSQL_DATABASE: rtsas_auth
      MYSQL_USER: rtsas
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-rtsas}
    ports:
      # เปิดพอร์ต 3307 บนเครื่อง Host เพื่อไม่ให้ชนกับพอร์ต 3306 ของ HOSxP
      - "3307:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "rtsas", "-prtsas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rtsas_net

  # ── 2. Backend (FastAPI Application Server) ────────────────────────────────
  # หน้าที่: คำนวณ NEWS Score, เช็คเตือนภัย Sepsis, ส่ง WebSocket, และให้บริการ REST API
  # สิ่งที่ต้องเตรียม:
  #   - ตรวจสอบไฟล์ .env ว่าตั้งค่า IP และสิทธิ์เชื่อมต่อ HOSxP ถูกต้องแล้ว
  #   - Backend จะรอให้ auth_db พร้อมทำงานก่อน (service_healthy) จึงจะเริ่มระบบ
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rtsas_backend
    restart: unless-stopped
    depends_on:
      auth_db:
        condition: service_healthy
    environment:
      TZ: Asia/Bangkok
      # 1. การเชื่อมต่อ Auth DB ภายในเครือข่าย Docker
      AUTH_DB_URL: mysql+pymysql://rtsas:${AUTH_DB_PASSWORD:-rtsas}@auth_db:3306/rtsas_auth

      # 2. ความปลอดภัย JWT สำหรับ Token Login
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_BEFORE_DEPLOY}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-8}

      # 3. การเชื่อมต่อฐานข้อมูล HOSxP โรงพยาบาล (อ่านข้อมูลสัญญาณชีพ)
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-12345678}
      DB_NAME: ${DB_NAME:-sepsis_db}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS:-1}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}

      # 4. การเชื่อมต่อฐานข้อมูล Dashboard (บันทึกและติดตามสถานะการรักษา)
      DASHBOARD_DB_HOST: ${DASHBOARD_DB_HOST:-host.docker.internal}
      DASHBOARD_DB_PORT: ${DASHBOARD_DB_PORT:-3306}
      DASHBOARD_DB_USER: ${DASHBOARD_DB_USER:-root}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:-12345678}
      DASHBOARD_DB_NAME: ${DASHBOARD_DB_NAME:-rtsas_dashboard}
      DASHBOARD_DB_MIN_CONNECTIONS: ${DASHBOARD_DB_MIN_CONNECTIONS:-1}
      DASHBOARD_DB_MAX_CONNECTIONS: ${DASHBOARD_DB_MAX_CONNECTIONS:-5}

      # 5. ตัวเลือกการดึงข้อมูลย้อนหลัง (false = Production ดึงเฉพาะวันนี้, true = ทดสอบดึงวันล่าสุด)
      ENABLE_DATE_FALLBACK: ${ENABLE_DATE_FALLBACK:-false}
    ports:
      # เปิดพอร์ต 8000 สำหรับ API Server และ WebSocket (/ws/alerts)
      - "8000:8000"
    extra_hosts:
      # อนุญาตให้ container backend มองเห็น Host Machine และเครือข่าย LAN ภายนอกได้
      - "host.docker.internal:host-gateway"
    networks:
      - rtsas_net

  # ── 3. Frontend (Web Application เสิร์ฟผ่าน Nginx) ──────────────────────────
  # หน้าที่: ส่วนติดต่อผู้ใช้งาน (UI) สำหรับแพทย์และพยาบาล รองรับ Real-time Sepsis Monitoring
  # สิ่งที่ต้องเตรียม:
  #   - ระบบจะ Build source code React/Vite และนำไฟล์ไปรันบน Nginx โดยอัตโนมัติ
  #   - เข้าใช้งานผ่านเว็บเบราว์เซอร์ได้ที่ http://localhost หรือ http://<IP-เครื่องเซิร์ฟเวอร์>
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: rtsas_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: Asia/Bangkok
    ports:
      # พอร์ต 80 สำหรับเข้าใช้งานหน้าเว็บหลัก
      - "80:80"
    networks:
      - rtsas_net

# ── พื้นที่จัดเก็บข้อมูลแบบถาวร (Persistent Volumes) ─────────────────────────
volumes:
  # บันทึกไฟล์ฐานข้อมูล auth_db เพื่อไม่ให้ User/Password สูญหายเมื่อปิดหรือ rebuild container
  auth_db_data:

# ── เครือข่ายภายใน (Internal Bridge Network) ──────────────────────────────────
networks:
  # เครือข่ายบริดจ์สำหรับให้ container ต่างๆ คุยหากันได้ด้วยชื่อ service (auth_db, backend, frontend)
  rtsas_net:
    driver: bridge
